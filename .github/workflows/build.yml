name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (universal arm64 + x86_64)"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Check architectures
        run: lipo -info "build/ArotronStudio_artefacts/Release/ADR Dub Studio.app/Contents/MacOS/ADR Dub Studio"
      - name: Sign (ad-hoc) and zip
        run: |
          APP="build/ArotronStudio_artefacts/Release/ADR Dub Studio.app"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" ADR-Dub-Studio-macOS-universal.zip
      - name: Publish to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "ADR Dub Studio ${{ github.ref_name }}" --notes "Build automatica. macOS: universale (Apple Silicon e Intel), firma ad-hoc: la prima volta clic destro > Apri. Windows: x64, senza il supporto video." || true
          sleep 10
          gh release upload "${{ github.ref_name }}" ADR-Dub-Studio-macOS-universal.zip --repo "${{ github.repository }}" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Zip
        shell: pwsh
        run: |
          $dir = "build/ArotronStudio_artefacts/Release"
          Get-ChildItem $dir
          Compress-Archive -Path "$dir/ADR Dub Studio.exe" -DestinationPath ADR-Dub-Studio-Windows-x64.zip
      - name: Publish to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "ADR Dub Studio ${{ github.ref_name }}" --notes "Build automatica. macOS: universale, firma ad-hoc. Windows: x64, senza il supporto video." 2>$null
          Start-Sleep -Seconds 15
          gh release upload "${{ github.ref_name }}" ADR-Dub-Studio-Windows-x64.zip --repo "${{ github.repository }}" --clobber
