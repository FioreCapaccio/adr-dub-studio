name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.10.0"

jobs:
  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (universal arm64 + x86_64)"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Check architectures
        run: lipo -info "build/ArotronStudio_artefacts/Release/ADR Dub Studio.app/Contents/MacOS/ADR Dub Studio"
      - name: Sign (ad-hoc) and zip
        run: |
          APP="build/ArotronStudio_artefacts/Release/ADR Dub Studio.app"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" ADR-Dub-Studio-${{ env.APP_VERSION }}-macOS-universal.zip
      - name: Publish to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "ADR Dub Studio ${{ github.ref_name }}" --notes "Build automatica. macOS: universale (Apple Silicon e Intel), firma ad-hoc: la prima volta clic destro > Apri. Windows: installer (Setup.exe) con ffmpeg incluso per il video, piu' una versione portatile (zip)." || true
          sleep 10
          gh release upload "${{ github.ref_name }}" ADR-Dub-Studio-${{ env.APP_VERSION }}-macOS-universal.zip --repo "${{ github.repository }}" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package (with ffmpeg for the video)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = Join-Path (Get-ChildItem ffmpeg_dl -Directory | Select-Object -First 1).FullName "bin"
          New-Item -ItemType Directory -Path pkg | Out-Null
          Copy-Item "build/ArotronStudio_artefacts/Release/ADR Dub Studio.exe" pkg/
          Copy-Item (Join-Path $bin "ffmpeg.exe"), (Join-Path $bin "ffprobe.exe") pkg/
          Copy-Item LICENSE pkg/
          Set-Content -Path pkg/FFMPEG.txt -Value "ffmpeg.exe e ffprobe.exe sono FFmpeg (https://ffmpeg.org), build LGPL di https://github.com/BtbN/FFmpeg-Builds , usati per leggere e esportare i video."
          Compress-Archive -Path pkg/* -DestinationPath ADR-Dub-Studio-${{ env.APP_VERSION }}-Windows-x64-portable.zip
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=${{ env.APP_VERSION }}" installer/adr-dub-studio.iss
          Get-ChildItem installer_out
      - name: Publish to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "ADR Dub Studio ${{ github.ref_name }}" --notes "Build automatica. macOS: universale, firma ad-hoc. Windows: installer (Setup.exe) con ffmpeg incluso per il video, piu' una versione portatile (zip)." 2>$null
          Start-Sleep -Seconds 15
          gh release upload "${{ github.ref_name }}" installer_out/ADR-Dub-Studio-${{ env.APP_VERSION }}-Windows-x64-Setup.exe ADR-Dub-Studio-${{ env.APP_VERSION }}-Windows-x64-portable.zip --repo "${{ github.repository }}" --clobber
