name: Build

on:
  push:
    tags: ['v*']   # solo i rilasci: ogni build costa minuti di Actions (macOS x10, Windows x2)
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.57.0"

jobs:
  macos-universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: "LAME (encoder MP3, eseguibile universale)"
        run: ./tools/build-lame.sh
      - name: "Configure (universal arm64 + x86_64)"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Check architectures
        run: |
          lipo -info "build/ArotronStudio_artefacts/Release/ADR Dub Studio.app/Contents/MacOS/ADR Dub Studio"
          lipo -info "build/ArotronStudio_artefacts/Release/ADR Dub Studio.app/Contents/MacOS/lame"
      - name: Sign (ad-hoc) and zip
        run: |
          APP="build/ArotronStudio_artefacts/Release/ADR Dub Studio.app"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" ADR-Dub-Studio-${{ env.APP_VERSION }}-macOS-universal.zip
      - name: Publish to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "ADR Dub Studio ${{ github.ref_name }}" --notes "Build automatica. macOS: universale (Apple Silicon e Intel), firma ad-hoc: la prima volta clic destro > Apri. Windows: installer (Setup.exe) con ffmpeg incluso per il video, piu' una versione portatile (zip)." || true
          sleep 10
          gh release upload "${{ github.ref_name }}" ADR-Dub-Studio-${{ env.APP_VERSION }}-macOS-universal.zip --repo "${{ github.repository }}" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebView2 SDK (manuale dentro l'app)
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2592.51 -OutputDirectory webview2pkg
      - name: Configure
        run: cmake -S . -B build -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}/webview2pkg"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package (with ffmpeg for the video)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = Join-Path (Get-ChildItem ffmpeg_dl -Directory | Select-Object -First 1).FullName "bin"
          New-Item -ItemType Directory -Path pkg | Out-Null
          Copy-Item "build/ArotronStudio_artefacts/Release/ADR Dub Studio.exe" pkg/
          Copy-Item (Join-Path $bin "ffmpeg.exe"), (Join-Path $bin "ffprobe.exe") pkg/
          Copy-Item Resources/legal/THIRD_PARTY_LICENSES.txt pkg/
          $ffl = Join-Path (Split-Path $bin -Parent) "LICENSE.txt"
          if (Test-Path $ffl) { Copy-Item $ffl (Join-Path pkg "FFMPEG-LICENSE.txt") } else { Write-Warning "LICENSE.txt di FFmpeg non trovato" }
          # condizioni d'uso al posto della licenza open source (UTF-8 con BOM, cosi' Inno Setup legge bene gli accenti)
          foreach ($l in 'it','en') { [IO.File]::WriteAllText("pkg/EULA_$l.txt", (Get-Content -Raw -Encoding utf8 "Resources/eula/eula_$l.txt"), (New-Object Text.UTF8Encoding $true)) }
          Set-Content -Path pkg/FFMPEG.txt -Value "ffmpeg.exe e ffprobe.exe sono FFmpeg (https://ffmpeg.org), build LGPL di https://github.com/BtbN/FFmpeg-Builds , usati per leggere e esportare i video."
          if (-not ((& pkg/ffmpeg.exe -hide_banner -encoders) -match "libmp3lame")) { throw "ffmpeg senza libmp3lame: l'esportazione MP3 non funzionerebbe" }
          Compress-Archive -Path pkg/* -DestinationPath ADR-Dub-Studio-${{ env.APP_VERSION }}-Windows-x64-portable.zip
      - name: Video playback test (ffmpeg player on Windows)
        shell: pwsh
        continue-on-error: true
        run: |
          & pkg/ffmpeg.exe -v error -y -f lavfi -i testsrc2=size=1920x1080:rate=25 -t 12 -c:v mpeg4 -q:v 5 bench.mp4
          $p = Start-Process -FilePath "pkg/ADR Dub Studio.exe" -ArgumentList "--video-bench", "`"$PWD\bench.mp4`"", "`"$PWD\bench.txt`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "video bench: timeout" }
          Get-Content bench.txt
          if (-not (Select-String -Path bench.txt -Pattern "VIDEO OK" -Quiet)) { throw "video bench non OK" }
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=${{ env.APP_VERSION }}" installer/adr-dub-studio.iss
          Get-ChildItem installer_out
      - name: Publish to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "ADR Dub Studio ${{ github.ref_name }}" --notes "Build automatica. macOS: universale, firma ad-hoc. Windows: installer (Setup.exe) con ffmpeg incluso per il video, piu' una versione portatile (zip)." 2>$null
          Start-Sleep -Seconds 15
          gh release upload "${{ github.ref_name }}" installer_out/ADR-Dub-Studio-${{ env.APP_VERSION }}-Windows-x64-Setup.exe ADR-Dub-Studio-${{ env.APP_VERSION }}-Windows-x64-portable.zip --repo "${{ github.repository }}" --clobber
